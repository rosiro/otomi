[project]
name = "otomi"
version = "0.1.0"
description = "CLAP で効果音ライブラリを自動カテゴライズ・検索するローカルツール"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
    "av>=12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tqdm>=4.66",
]

[project.scripts]
otomi = "otomi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["otomi"]

# GPU (CUDA 12.6) 版 PyTorch を使う。CPU のみの環境ではこのブロックを削除すれば PyPI の CPU 版になる。
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
