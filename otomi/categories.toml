# otomi カテゴリ定義
#
# [グループID]
# name = "表示名"
# [グループID.items]
# サブカテゴリID = { name = "表示名", prompts = ["英語の説明", ...] }
#
# - prompts は CLAP のテキストエンコーダに渡す英語の説明文です (CLAP は英語のみ対応)。
#   複数書くと平均した埋め込みで判定するので、言い換えを並べると精度が上がりやすくなります。
# - カテゴリの追加・変更は再インデックス不要です (音声の埋め込みは保存済みのため)。
# - カスタマイズする場合はこのファイルを data/categories.toml にコピーして編集してください。
#   data/ 側にファイルがあればそちらが優先されます。

[ui]
name = "UI・システム音"
[ui.items]
click   = { name = "クリック・決定", prompts = ["a short UI click", "button click interface sound", "menu select confirm blip"] }
cancel  = { name = "キャンセル・戻る", prompts = ["UI cancel sound", "a soft descending interface blip", "back button sound"] }
cursor  = { name = "カーソル移動", prompts = ["a tiny cursor move tick", "menu cursor sound"] }
notify  = { name = "通知・アラート", prompts = ["notification chime", "alert ding", "message received sound"] }
error   = { name = "エラー・警告", prompts = ["error buzzer", "wrong answer buzz", "warning beep"] }
success = { name = "成功・クリア", prompts = ["success jingle", "level complete fanfare", "positive achievement chime"] }
coin    = { name = "コイン・アイテム取得", prompts = ["coin pickup sound", "item get sparkle", "collecting a coin in a video game"] }

